name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Check for console.log (non-dev)
        run: |
          if grep -r "console\.log" src --include="*.js" --include="*.jsx" \
            | grep -v "src/lib/email.js" \
            | grep -v ".test.js" ; then
            echo "❌ Found console.log statements in production code"
            exit 1
          fi
        continue-on-error: true

      - name: Check for TODO comments
        run: |
          echo "📝 TODO comments found:"
          grep -r "TODO\|FIXME\|HACK" src --include="*.js" --include="*.jsx" || echo "None found"
        continue-on-error: true
